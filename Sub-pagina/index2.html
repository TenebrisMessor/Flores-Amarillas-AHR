<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flores amarillas 💛</title>
<style>
*,:after,:before{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#000;--ink:#fff;--btn:#fbde00;--btn-ink:#111}
html,body{height:100%}
body{display:flex;align-items:flex-end;justify-content:center;min-height:100vh;background:var(--dark);overflow:hidden;perspective:1000px;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial}
.felicitacion{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;color:var(--ink);font-size:clamp(18px,4vw,28px);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.night{position:fixed;left:50%;top:0;transform:translateX(-50%);width:100%;height:100%;filter:blur(.1vmin);background-image:radial-gradient(ellipse at top,transparent 0%,var(--dark)),radial-gradient(ellipse at bottom,var(--dark),rgba(145,233,255,.2)),repeating-linear-gradient(220deg,#000 0,#000 19px,transparent 19px,transparent 22px),repeating-linear-gradient(189deg,#000 0,#000 19px,transparent 19px,transparent 22px),repeating-linear-gradient(148deg,#000 0,#000 19px,transparent 19px,transparent 22px),linear-gradient(90deg,#00fffa,#f0f0f0)}
.flowers{position:relative;transform:scale(.9)}
.flower{position:absolute;bottom:10vmin;transform-origin:bottom center;z-index:10}
.flower__leafs{position:relative;animation:blooming-flower 2s backwards}
.flower__leafs::after{content:"";position:absolute;left:0;top:0;transform:translate(-50%,-100%);width:8vmin;height:8vmin;background:#6bf0ff;filter:blur(10vmin)}
.flower__leaf{position:absolute;bottom:0;left:50%;width:8vmin;height:11vmin;border-radius:51% 49% 47% 53%/44% 45% 55% 69%;background:#a7ffee;background-image:linear-gradient(to top,#54b8aa,#FFD700);transform-origin:bottom center;opacity:.9;box-shadow:inset 0 0 2vmin rgba(255,255,255,.5)}
.flower__leaf--1{transform:translate(-10%,1%) rotateY(40deg) rotateX(-50deg)}
.flower__leaf--2{transform:translate(-50%,-4%) rotateX(40deg)}
.flower__leaf--3{transform:translate(-90%,0) rotateY(45deg) rotateX(50deg)}
.flower__leaf--4{width:8vmin;height:8vmin;transform-origin:bottom left;border-radius:4vmin 10vmin 4vmin 4vmin;transform:translate(0,18%) rotateX(70deg) rotate(-43deg);background-image:linear-gradient(to top,#39c6d6,#FFD700);z-index:1;opacity:.8}
.flower__white-circle{position:absolute;left:-3.5vmin;top:-3vmin;width:9vmin;height:4vmin;border-radius:50%;background:#fff}
.flower__white-circle::after{content:"";position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:60%;height:60%;border-radius:inherit;background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.03) 0,rgba(0,0,0,.03) 1px,transparent 1px,transparent 12px),linear-gradient(90deg,#ffeb12,#ffce00)}
.flower__line{height:55vmin;width:1.5vmin;background-image:linear-gradient(to left,rgba(0,0,0,.2),transparent,rgba(255,255,255,.2)),linear-gradient(to top,transparent 10%,#14757a,#39c6d6);box-shadow:inset 0 0 2px rgba(0,0,0,.5);animation:grow-flower-tree 4s backwards}
.flower__line__leaf{--w:7vmin;--h:calc(var(--w) + 2vmin);position:absolute;top:20%;left:90%;width:var(--w);height:var(--h);border-top-right-radius:var(--h);border-bottom-left-radius:var(--h);background-image:linear-gradient(to top,rgba(20,117,122,.4),#39c6d6)}
.flower__line__leaf--2{top:45%}
.flower__line__leaf--3,.flower__line__leaf--4,.flower__line__leaf--6{border-top-right-radius:0;border-bottom-left-radius:0;border-top-left-radius:var(--h);border-bottom-right-radius:var(--h);left:-460%;top:12%;transform:rotate(-70deg) rotateY(30deg)}
.flower__line__leaf--4{top:40%}
.flower__line__leaf--5{top:0;transform-origin:left;transform:rotate(70deg) rotateY(30deg) scale(.6)}
.flower__line__leaf--6{top:-2%;left:-450%;transform-origin:right;transform:rotate(-70deg) rotateY(30deg) scale(.6)}
.flower__light{position:absolute;bottom:0;width:1vmin;height:1vmin;background:#fffb00;border-radius:50%;filter:blur(.2vmin);animation:light-ans 4s linear infinite backwards}
.flower__light:nth-child(odd){background:#23f0ff}
.flower--1{animation:moving-flower-1 4s linear infinite}
.flower--2{left:50%;transform:rotate(20deg);animation:moving-flower-2 4s linear infinite}
.flower--3{left:50%;transform:rotate(-15deg);animation:moving-flower-3 4s linear infinite}

/* Distribución por cantidad */
.flowers.grid-1{display:flex;align-items:flex-end;justify-content:center;transform:scale(.95)}
.flowers.grid-3{position:relative;transform:scale(.9)}
.flowers.grid-3 .flower{position:absolute}
.flowers.grid-3 .pos-1{left:15%}
.flowers.grid-3 .pos-2{left:50%;transform:translateX(-50%) rotate(20deg)}
.flowers.grid-3 .pos-3{right:15%;transform:rotate(-15deg)}
.flowers.grid-12{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2vmin;width:min(92vw,1100px);margin:0 auto 10vmin;transform:scale(.9)}
.flowers.grid-12 .flower{position:static;bottom:auto;margin:auto;transform-origin:center}
.flowers.grid-12 .flower__line{height:38vmin}
.flowers.grid-12 .flower__leaf{width:6vmin;height:8.5vmin}

/* Acciones */
.bottom-actions{position:fixed;bottom:16px;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:20}
.btn{background:var(--btn);color:var(--btn-ink);border-radius:12px;padding:10px 14px;text-decoration:none;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.35)}

/* Animaciones clave */
@keyframes blooming-flower{0%{transform:scale(0)}}
@keyframes grow-flower-tree{0%{height:0;border-radius:1vmin}}
@keyframes light-ans{0%{opacity:0;transform:translateY(0)}25%{opacity:1;transform:translateY(-5vmin) translateX(-2vmin)}50%{opacity:1;transform:translateY(-15vmin) translateX(2vmin);filter:blur(.2vmin)}75%{transform:translateY(-20vmin) translateX(-2vmin);filter:blur(.2vmin)}100%{transform:translateY(-30vmin);opacity:0;filter:blur(1vmin)}}
@keyframes moving-flower-1{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-2deg)}}
@keyframes moving-flower-2{0%,100%{transform:rotate(18deg)}50%{transform:rotate(14deg)}}
@keyframes moving-flower-3{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(-20deg) rotateY(-10deg)}}
</style>
</head>
<body class="not-loaded">
  <div class="felicitacion" id="felicitacion">Para la inge, de parte de Ariel 💛</div>
  <div class="night"></div>

  <div class="flowers" id="flowers"></div>

  <!-- plantilla de flor, se clona -->
  <template id="flowerTpl">
    <div class="flower">
      <div class="flower__leafs">
        <div class="flower__leaf flower__leaf--1"></div>
        <div class="flower__leaf flower__leaf--2"></div>
        <div class="flower__leaf flower__leaf--3"></div>
        <div class="flower__leaf flower__leaf--4"></div>
        <div class="flower__white-circle"></div>
        <div class="flower__light flower__light--1"></div>
        <div class="flower__light flower__light--2"></div>
        <div class="flower__light flower__light--3"></div>
        <div class="flower__light flower__light--4"></div>
        <div class="flower__light flower__light--5"></div>
        <div class="flower__light flower__light--6"></div>
        <div class="flower__light flower__light--7"></div>
        <div class="flower__light flower__light--8"></div>
      </div>
      <div class="flower__line">
        <div class="flower__line__leaf flower__line__leaf--1"></div>
        <div class="flower__line__leaf flower__line__leaf--2"></div>
        <div class="flower__line__leaf flower__line__leaf--3"></div>
        <div class="flower__line__leaf flower__line__leaf--4"></div>
        <div class="flower__line__leaf flower__line__leaf--5"></div>
        <div class="flower__line__leaf flower__line__leaf--6"></div>
      </div>
    </div>
  </template>

  <div class="bottom-actions">
    <a class="btn" id="btnBack" href="../index2.html">Volver</a>
    <a class="btn" id="btnOne"   href="?n=1">1 flor</a>
    <a class="btn" id="btnTri"   href="?n=3">3 flores</a>
    <a class="btn" id="btnDoce"  href="?n=12">12 flores</a>
  </div>

<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const n = (() => {
    const val = parseInt(qs.get('n') || '12', 10);
    if (isNaN(val)) return 12;
    return Math.min(12, Math.max(1, val));
  })();
  const to = qs.get('to') || 'Luna';
  const from = qs.get('from') || 'Ariel HR';
  const msg = qs.get('msg') || (n===12 ? `Una docena amarilla para ${to} 💛 — de ${from}` :
                                          `Para ${to}, de parte de ${from} 💛`);
  document.getElementById('felicitacion').textContent = msg;

  // layout por cantidad
  const wrap = document.getElementById('flowers');
  wrap.classList.add(n===1?'grid-1':n===3?'grid-3':'grid-12');

  // clonado
  const tpl = document.getElementById('flowerTpl');
  const variant = i => (i % 3) + 1;

  for (let i=0;i<n;i++){
    const node = tpl.content.firstElementChild.cloneNode(true);
    const v = variant(i);
    node.classList.add(`flower--${v}`);
    node.querySelector('.flower__leafs').classList.add(`flower__leafs--${v}`);
    node.querySelector('.flower__line').style.animationDelay = `${0.3*v}s`;
    if (n===3) node.classList.add(`pos-${i+1}`); // triángulo
    wrap.appendChild(node);
  }

  // arranque animaciones
  window.addEventListener('load', () => {
    setTimeout(()=> document.body.classList.remove('not-loaded'), 700);
  });

  // conservar params (to/from/msg) al navegar entre n=...
  const keepParams = (a) => {
    const url = new URL(a.href, location.href);
    const kept = new URLSearchParams(qs.toString());
    kept.set('n', new URL(url).searchParams.get('n') || '12');
    a.href = `${location.pathname}?${kept.toString()}`;
  };
  ['btnOne','btnTri','btnDoce'].forEach(id=>{
    const a=document.getElementById(id); if(a) keepParams(a);
  });
  const back=document.getElementById('btnBack');
  if(back){ const u=new URL(back.getAttribute('href'),location.href); u.search=qs.toString(); back.href=u.toString(); }

  // título cuando te vas/volver
  let baseTitle=document.title;
  window.addEventListener('blur',()=>{ baseTitle=document.title; document.title='No te vayas, regresa :('; });
  window.addEventListener('focus',()=>{ document.title=baseTitle; });
})();
</script>
</body>
</html>
